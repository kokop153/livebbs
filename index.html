        // 从 localStorage 获取内容配置
        function getContent() {
            const stored = localStorage.getItem('livebbs_home_content');
            if (stored) {
                return JSON.parse(stored);
            }
            return defaultContent;
        }

        // 保存内容配置
        function saveContent(content) {
            localStorage.setItem('livebbs_home_content', JSON.stringify(content));
        }

        // 渲染首页内容
        function renderSections() {
            const container = document.getElementById('sections-container');
            const content = getContent();
            
            let html = '';
            content.forEach(item => {
                if (item.noImg) {
                    // 无图片卡片
                    html += `
                        <div class="section-card no-img" id="${item.id}">
                            <div class="section-info">
                                <div class="section-title">${item.title}</div>
                                <div class="section-subtitle">${item.subtitle || ''}</div>
                                ${item.link ? `<a href="${item.link}" class="section-link">${item.linkText || '立即前往'}
                                    <svg xmlns="http://www.w3.org/2000/svg" width="25" height="25" viewBox="0 0 48 48"><path fill="none" stroke="#1a3a5c" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="m19 12l12 12l-12 12"/></svg>
                                </a>` : ''}
                            </div>
                        </div>
                    `;
                } else {
                    // 有图片卡片
                    const linkHtml = item.links ? 
                        item.links.map(l => `<a href="${l.href}" target="_blank" class="section-link"><img src="img/${l.icon}.png" width="13"> ${l.text}</a>`).join('') :
                        `<a href="${item.link}" target="_blank" class="section-link"><img src="img/${item.icon}.svg" width="20"> ${item.linkText || '查看'}</a>`;
                    
                    html += `
                        <div class="section-card" id="${item.id}">
                            <img src="${item.img}" alt="图片" class="section-img">
                            <div class="section-info">
                                <div class="section-title">${item.title}</div>
                                <div class="section-subtitle">${item.subtitle || ''}</div>
                                ${linkHtml}
                            </div>
                        </div>
                    `;
                }
            });
            
            container.innerHTML = html;
        }

        // 页面加载时渲染
